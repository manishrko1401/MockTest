[package]
name = "mocktesthub"
version = "1.0.3"
description = "Mock Test Hub for Windows"
authors = ["Mock Test Hub"]
edition = "2021"

[lib]
name = "mocktesthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Offline tests: encrypted for this device (X25519 + HKDF-SHA256 + AES-256-GCM)
aes-gcm = "=0.10.3"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
hkdf = "=0.12.4"
sha2 = "=0.10.8"
base64 = "=0.22.1"
getrandom = "0.2"

# Same versions Tauri's WebView2 layer uses (to switch browser shortcut keys during tests);
# Cryptography = DPAPI, which ties the device key to this Windows account on this PC
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
